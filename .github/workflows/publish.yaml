name: Publish to pub.dev

on:
  push:
    tags:
      - "sealed_language_subtags-v[0-9]+.[0-9]+.[0-9]+"
      - "sealed_language_extensions-v[0-9]+.[0-9]+.[0-9]+"

# pub.dev automated publishing uses OIDC; no long-lived credentials are stored.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=packages/$name" >> "$GITHUB_OUTPUT"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Publish ${{ steps.pkg.outputs.name }}
        working-directory: ${{ steps.pkg.outputs.path }}
        run: dart pub publish --force
